name: Android • signed release manual
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RTSMART_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rtsmartpro.jks"
          chmod 600 "$RUNNER_TEMP/rtsmartpro.jks"
          chmod +x gradlew
      - name: Build signed APK and Android App Bundle
        env:
          RTSMART_KEYSTORE: ${{ runner.temp }}/rtsmartpro.jks
          RTSMART_STORE_PASSWORD: ${{ secrets.RTSMART_STORE_PASSWORD }}
          RTSMART_KEY_PASSWORD: ${{ secrets.RTSMART_KEY_PASSWORD }}
        run: ./gradlew lintRelease assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RT-Smart-PRO-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
      - name: Clean signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/rtsmartpro.jks"
