name: rtsmartpro
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rtsmartpro
      POSTGRES_USER: rtsmartpro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    ports: ["127.0.0.1:35432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtsmartpro"]
      interval: 5s
      retries: 20
  api:
    container_name: rtsmartpro-api
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://rtsmartpro:${DB_PASSWORD}@db:5432/rtsmartpro
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
    ports: ["127.0.0.1:38081:8000"]
    depends_on:
      db: {condition: service_healthy}
    networks:
      default:
      edge:
        aliases: [rtsmartpro-api]
volumes:
  postgres:
networks:
  edge:
    external: true
    name: ai-chat_default
